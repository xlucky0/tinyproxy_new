name: OpenWrt APK packages

# Builds tinyproxy once per OpenWrt package architecture and attaches
# <name>_openwrt-25.12_<arch>.apk files to a GitHub Release.
# luci-app-tinyproxy is architecture independent and is attached once.

on:
  release:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to upload APKs to (empty = only keep as workflow artifact)
        required: false
        type: string

permissions:
  contents: write

env:
  OPENWRT_BRANCH: openwrt-25.12
  OPENWRT_LABEL: openwrt-25.12

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9
          - arm_cortex-a9_vfpv3-d16
          - mipsel_24kc
          - mips_24kc
          - x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@v8
        env:
          ARCH: ${{ matrix.arch }}-${{ env.OPENWRT_BRANCH }}
          FEEDNAME: tinyproxy_new
          PACKAGES: tinyproxy luci-app-tinyproxy
          NO_REFRESH_CHECK: true
          INDEX: 1

      - name: Collect APK packages
        shell: bash
        run: |
          mkdir -p release-apk
          while IFS= read -r -d '' package; do
            name="$(basename "$package" .apk)"
            case "$name" in
              # LuCI app is architecture independent: same file from every job
              luci-app-tinyproxy-*) cp "$package" "release-apk/${name}_${OPENWRT_LABEL}_all.apk" ;;
              *) cp "$package" "release-apk/${name}_${OPENWRT_LABEL}_${{ matrix.arch }}.apk" ;;
            esac
          done < <(find bin/packages -type f -name '*.apk' -print0)
          test -n "$(find release-apk -type f -name '*.apk' -print -quit)"
          ls -l release-apk

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-apk-${{ matrix.arch }}
          path: release-apk/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach APKs to release
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: openwrt-apk-*
          path: release-apk
          merge-multiple: true

      - name: List files
        run: ls -l release-apk

      - name: Upload packages to GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: release-apk/*.apk

      - name: Upload combined package artifact
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-apk-all-architectures
          path: release-apk/*.apk
